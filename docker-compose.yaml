# mcp-krs - odpisy KRS (api-krs.ms.gov.pl) (stdio z repo -> supergateway, Streamable HTTP /mcp, port 8000). Stack Portainera "mcp-krs".
# Bez portu na hoscie. Dostep wylacznie: https://mcp-krs.xlap.pl/mcp - tunel cloudflared, bez Access (publiczny,
# bezstanowy - konektory claude.ai/ChatGPT). cf_mcp_krs: cloudflared + ten serwis, z wyjsciem do internetu.
# Przebudowa po pushu na main: deploy-hook (.github/workflows/deploy.yml).
services:
  mcp-krs:
    build:
      context: /volume2/docker/mcp-krs
      dockerfile: Dockerfile.nas
    image: mcp-krs:latest
    container_name: mcp-krs
    user: "1029:100"
    environment:
      - TZ=Europe/Warsaw
    networks:
      - cf_mcp_krs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

networks:
  cf_mcp_krs:
    external: true
